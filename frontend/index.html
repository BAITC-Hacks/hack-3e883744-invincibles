<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101112" />
    <script>try { const theme = localStorage.getItem('shagra.theme'); document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; const language = localStorage.getItem('shagra.language'); document.documentElement.lang = ['ru', 'kk', 'en'].includes(language) ? language : 'ru'; } catch {}</script>
    <title>ШАГРА — примерка карьерного шага</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
